[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpc-n-roll"
version = "0.1.0"
description = "pytest plugin that makes gRPC tests read like REST"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "pytest>=7.0",
]

[project.optional-dependencies]
reflection = ["grpcio-reflection>=1.60"]
dev = [
    "grpcio-reflection>=1.60",
    "grpcio-tools>=1.60",
    "pytest>=7.0",
]

[project.entry-points.pytest11]
grpc_n_roll = "grpc_n_roll.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/grpc_n_roll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "unit: fast tests that do not start a gRPC server",
    "integration: tests that start an in-process gRPC server",
    "slow: tests that wait on deadlines or a live server",
]

[tool.ruff]
line-length = 100
target-version = "py310"
